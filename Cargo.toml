[workspace]
members = [
    "doomgeneric-core",
    "doomgeneric-host-headless",
    "doomgeneric-host-wgpu",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.76"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
panic = "abort"
strip = true
lto = true